{# ช่องกรอกรายจ่าย ใช้ร่วมกันระหว่างหน้าเพิ่มและหน้าแก้ไข: row (ถ้ามี), categories, items, methods #}
<div class="form-row">
  <div class="field"><label>วันที่จ่าย</label><input type="date" name="expense_date" value="{{ row.expense_date if row else today }}" required></div>
  <div class="field"><label>หมวด</label>
    <div class="seg">{% for k, v in categories.items() %}<label class="check"><input type="radio" name="category" value="{{ k }}" {{ 'checked' if (row.category if row else 'common') == k }}> {{ v }}</label>{% endfor %}</div></div>
  <div class="field"><label>รายการ *</label><input type="text" name="item" value="{{ row.item if row else '' }}" list="expense-items" required placeholder="เช่น ค่าไฟฟ้าส่วนกลาง">
    <datalist id="expense-items">{% for k, lst in items.items() %}{% for i in lst %}<option value="{{ i }}">{{ categories[k] }}</option>{% endfor %}{% endfor %}</datalist></div>
  <div class="field"><label>จำนวนเงิน (บาท) *</label><input type="number" step="0.01" min="0.01" name="amount" value="{{ '%.2f'|format(row.amount) if row else '' }}" required></div>
</div>
<div class="form-row">
  <div class="field"><label>รายละเอียด</label><input type="text" name="description" value="{{ row.description if row else '' }}" placeholder="เช่น บิลเดือน ก.ย. / ซ่อมปั๊มน้ำชั้น 3"></div>
  <div class="field"><label>จ่ายให้</label><input type="text" name="payee" value="{{ row.payee if row else '' }}" placeholder="เช่น การไฟฟ้านครหลวง"></div>
  <div class="field"><label>วิธีจ่าย</label><select name="method"><option value="">-</option>{% for m in methods %}<option {{ 'selected' if row and row.method == m }}>{{ m }}</option>{% endfor %}</select></div>
  <div class="field"><label>เลขที่เอกสาร / อ้างอิง</label><input type="text" name="reference" value="{{ row.reference if row else '' }}"></div>
</div>
