{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block content %}
<h1>เปลี่ยนรหัสผ่าน</h1>
<div class="card" style="max-width:460px">
  <form method="post">
    {{ csrf() }}
    <div class="field"><label>รหัสผ่านปัจจุบัน</label><input type="password" name="current_password" required autocomplete="current-password"></div>
    <div class="field"><label>รหัสผ่านใหม่</label><input type="password" name="new_password" required minlength="6" autocomplete="new-password"></div>
    <div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" name="confirm_password" required minlength="6" autocomplete="new-password"></div>
    <button class="btn btn-primary">บันทึก</button>
  </form>
</div>
{% endblock %}
